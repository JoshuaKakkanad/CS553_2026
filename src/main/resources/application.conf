akka {
  loglevel = "INFO"
  
  actor {
    provider = "local"
    
    serialization-bindings {
      "com.uic.cs553.distributed.framework.DistributedMessage" = jackson-json
    }
  }
  
  # Disable warning messages
  coordinated-shutdown {
    exit-jvm = on
  }
}

cinnamon {
  akka.actors {
    default-by-class {
      includes = "/user/*"
      report-by = class
    }
  }
}

sim {
  seed = 1
  runForSeconds = 10

  netgamesim {
    treatUndirectedAsBidirectional = true
  }

  graph {
    ringN = 20
  }

  edgeLabeling {
    # Allowed message kinds on every directed edge unless overridden.
    default = [ "CONTROL", "PING", "GOSSIP" ]

    # Example override: allow WORK only on one edge
    overrides = [
      { from = 0, to = 1, allow = [ "CONTROL", "PING", "WORK", "ACK" ] }
    ]
  }

  traffic {
    # Default per-node message production model (used by TimerMode=pdf)
    default {
      family = "zipf"
      kinds = [ "PING", "GOSSIP", "WORK" ]
      s = 1.1
    }

    # Optional per-node override
    perNode = [
      { node = 0, pdf = { family = "explicit", entries = [ { msg = "WORK", p = 0.9 }, { msg = "PING", p = 0.1 } ] } }
    ]
  }

  initiators {
    # Timer nodes drive background traffic and can be used to kick off algorithms that rely on ticks.
    timers = [
      { node = 0, tickEveryMs = 100, mode = "pdf" },
      { node = 7, tickEveryMs = 250, mode = "fixed", fixedMsg = "PING" }
    ]

    # Only nodes listed here accept external injections from the CLI.
    inputs = [
      { node = 0 },
      { node = 1 }
    ]
  }
}
