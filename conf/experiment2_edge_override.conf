sim {
  seed = 2
  runForSeconds = 10

  graph { ringN = 12 }

  edgeLabeling {
    default = [ "CONTROL", "PING" ]
    overrides = [
      { from = 0, to = 1, allow = [ "CONTROL", "PING", "WORK", "ACK" ] }
    ]
  }

  traffic {
    default { family = "zipf", kinds = [ "PING", "WORK" ], s = 1.2 }
  }

  initiators {
    timers = [
      { node = 0, tickEveryMs = 75, mode = "pdf" },
      { node = 6, tickEveryMs = 200, mode = "fixed", fixedMsg = "WORK" }
    ]
    inputs = [ { node = 0 }, { node = 1 } ]
  }
}

