sim {
  seed = 3
  runForSeconds = 15

  graph { ringN = 10 }

  edgeLabeling {
    default = [ "CONTROL", "PING", "WORK", "ACK" ]
  }

  traffic {
    default { family = "uniform", kinds = [ "PING", "GOSSIP" ] }
    perNode = [
      { node = 0, pdf = { family = "explicit", entries = [ { msg = "WORK", p = 0.7 }, { msg = "PING", p = 0.3 } ] } }
    ]
  }

  initiators {
    timers = [
      { node = 2, tickEveryMs = 120, mode = "pdf" }
    ]
    inputs = [ { node = 0 }, { node = 5 } ]
  }
}

